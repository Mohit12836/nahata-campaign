name: Quality Gates

on:
  push:
    branches:
      - main
      - "audit/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Baseline lockfile is out of sync; npm ci currently fails before checks start.
        # Use npm install to run gates while lockfile sync remains a tracked release task.
        run: npm install --no-audit --no-fund

      - name: Full repository lint (baseline diagnostic)
        id: full_lint
        continue-on-error: true
        run: npm run lint

      - name: Lint changed files (required)
        shell: bash
        run: |
          git fetch origin main --depth=1
          files="$(git diff --name-only origin/main...HEAD | grep -E '\\.(ts|tsx|js|jsx|mjs|cjs)$' || true)"
          if [ -z "$files" ]; then
            echo "No changed JavaScript/TypeScript files to lint."
            exit 0
          fi
          printf '%s\n' "$files" | xargs npx eslint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Security and functional test suite
        env:
          NODE_ENV: test
        run: npx --yes tsx@4.20.6 scripts/test-suite.ts

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Report baseline lint debt
        if: always()
        run: |
          echo "Full-repository lint outcome: ${{ steps.full_lint.outcome }}"
          if [ "${{ steps.full_lint.outcome }}" = "failure" ]; then
            echo "::warning::Existing full-repository lint errors remain; see the Full repository lint step. Changed-file lint, typecheck, tests and build are separate gates."
          fi
