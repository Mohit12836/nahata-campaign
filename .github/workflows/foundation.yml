name: Foundation checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Lint, types, source policies and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Resolve missing lockfile package metadata
        run: |
          npm view @emnapi/core@1.11.3 version dist.tarball dist.integrity dependencies --json
          npm view @emnapi/runtime@1.11.3 version dist.tarball dist.integrity dependencies --json
      - run: npm ci
      - run: node --test scripts/foundation.test.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
