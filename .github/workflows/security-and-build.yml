name: Security and Build Checks

on:
  pull_request:
    branches: [main, security/admin-fail-closed-20261019]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Credential fail-closed tests
        run: node --experimental-strip-types --test scripts/admin-auth-config.test.mjs

      - name: Multi-tenant public store projection tests
        run: node --experimental-strip-types --test scripts/public-store.test.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Production bundle compile (no secrets)
        run: npm run build
