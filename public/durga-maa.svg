<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Divine Radial Glow Background -->
    <radialGradient id="divineAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFE885" stop-opacity="1" />
      <stop offset="35%" stop-color="#FFA200" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#D92027" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4A000A" stop-opacity="1" />
    </radialGradient>

    <!-- Golden Shimmer Gradients -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7B2" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#E5A900" />
      <stop offset="100%" stop-color="#B87300" />
    </linearGradient>

    <linearGradient id="trishulGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFE57F" />
      <stop offset="70%" stop-color="#FFAB00" />
      <stop offset="100%" stop-color="#C67D00" />
    </linearGradient>

    <linearGradient id="sindoorRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Sacred Crimson Canvas -->
  <rect width="500" height="500" fill="url(#divineAura)" rx="250" />

  <!-- Outer Sacred Border Halo -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="url(#goldCrown)" stroke-width="6" opacity="0.9" />
  <circle cx="250" cy="250" r="232" fill="none" stroke="#FFF7B2" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.75" />

  <!-- Radiating Sun Rays (Surya Prabha Halo) -->
  <g opacity="0.45" stroke="#FFE785" stroke-width="2">
    <line x1="250" y1="20" x2="250" y2="70" />
    <line x1="250" y1="480" x2="250" y2="430" />
    <line x1="20" y1="250" x2="70" y2="250" />
    <line x1="480" y1="250" x2="430" y2="250" />
    <line x1="87" y1="87" x2="125" y2="125" />
    <line x1="413" y1="87" x2="375" y2="125" />
    <line x1="87" y1="413" x2="125" y2="375" />
    <line x1="413" y1="413" x2="375" y2="375" />
    <line x1="160" y1="40" x2="180" y2="85" />
    <line x1="340" y1="40" x2="320" y2="85" />
    <line x1="40" y1="160" x2="85" y2="180" />
    <line x1="40" y1="340" x2="85" y2="320" />
    <line x1="460" y1="160" x2="415" y2="180" />
    <line x1="460" y1="340" x2="415" y2="320" />
  </g>

  <!-- Divine Third Eye Flame / Aura Halo Behind Mukut -->
  <circle cx="250" cy="215" r="145" fill="#FFA500" opacity="0.35" filter="url(#divineGlow)" />
  <circle cx="250" cy="215" r="110" fill="#FFD700" opacity="0.4" />

  <!-- ======================================================== -->
  <!-- 1. DIVINE GOLDEN MUKUT (CROWN OF MAA DURGA)              -->
  <!-- ======================================================== -->
  <g filter="url(#softShadow)">
    <!-- Base Arch of Crown -->
    <path d="M 170 175 C 210 185, 290 185, 330 175 L 335 155 C 290 162, 210 162, 165 155 Z" fill="url(#goldCrown)" stroke="#FFD700" stroke-width="2" />

    <!-- Crown Middle Jewels Tier -->
    <path d="M 180 155 C 215 160, 285 160, 320 155 L 310 115 C 275 125, 225 125, 190 115 Z" fill="url(#goldCrown)" />
    
    <!-- Royal Peaks of Crown -->
    <!-- Left Spire -->
    <path d="M 180 155 L 165 95 L 205 130 Z" fill="url(#goldCrown)" stroke="#FFE082" stroke-width="1.5" />
    <circle cx="165" cy="92" r="6" fill="#D50000" stroke="#FFD700" stroke-width="2" />

    <!-- Right Spire -->
    <path d="M 320 155 L 335 95 L 295 130 Z" fill="url(#goldCrown)" stroke="#FFE082" stroke-width="1.5" />
    <circle cx="335" cy="92" r="6" fill="#D50000" stroke="#FFD700" stroke-width="2" />

    <!-- Center Grand High Spire -->
    <path d="M 215 125 L 250 55 L 285 125 C 265 120, 235 120, 215 125 Z" fill="url(#goldCrown)" stroke="#FFF9C4" stroke-width="2" />
    <circle cx="250" cy="50" r="9" fill="url(#sindoorRed)" stroke="#FFD700" stroke-width="2.5" />

    <!-- Central Ruby in Crown -->
    <polygon points="250,135 258,148 250,160 242,148" fill="#D50000" stroke="#FFF" stroke-width="1.5" />
    <!-- Pearl strings on crown -->
    <circle cx="215" cy="170" r="3.5" fill="#FFFFFF" />
    <circle cx="232" cy="172" r="3.5" fill="#FFFFFF" />
    <circle cx="250" cy="173" r="4.5" fill="#FFEB3B" />
    <circle cx="268" cy="172" r="3.5" fill="#FFFFFF" />
    <circle cx="285" cy="170" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. SACRED RED TILAK & CHANDAN TRISHUL TILAK              -->
  <!-- ======================================================== -->
  <!-- Chandan (Yellow Crescent) -->
  <path d="M 232 205 C 242 210, 258 210, 268 205 C 258 214, 242 214, 232 205 Z" fill="#FFF59D" />
  <!-- Sindoor Bindi -->
  <circle cx="250" cy="205" r="9.5" fill="url(#sindoorRed)" stroke="#FFE082" stroke-width="1.5" filter="url(#divineGlow)" />
  <!-- Chandan Dot above bindi -->
  <circle cx="250" cy="191" r="3" fill="#FFF9C4" />

  <!-- ======================================================== -->
  <!-- 3. THE DIVINE EYES OF MAA DURGA (DIVINE NETRA)           -->
  <!-- ======================================================== -->
  <!-- Left Eyebrow -->
  <path d="M 180 220 Q 212 210 236 226" fill="none" stroke="#210505" stroke-width="4.5" stroke-linecap="round" />
  <!-- Left Eye Outer Contour -->
  <path d="M 180 235 Q 212 215 238 238 Q 212 260 180 235 Z" fill="#FFFFFF" stroke="#1A0202" stroke-width="3.5" />
  <!-- Left Iris & Pupil -->
  <ellipse cx="212" cy="236" rx="10" ry="11" fill="#2E0A05" />
  <circle cx="212" cy="236" r="6" fill="#000000" />
  <circle cx="209" cy="233" r="2.5" fill="#FFFFFF" />
  <!-- Kajal extension on outer corner -->
  <path d="M 180 235 Q 166 230 158 224" fill="none" stroke="#1A0202" stroke-width="3" stroke-linecap="round" />

  <!-- Right Eyebrow -->
  <path d="M 320 220 Q 288 210 264 226" fill="none" stroke="#210505" stroke-width="4.5" stroke-linecap="round" />
  <!-- Right Eye Outer Contour -->
  <path d="M 320 235 Q 288 215 262 238 Q 288 260 320 235 Z" fill="#FFFFFF" stroke="#1A0202" stroke-width="3.5" />
  <!-- Right Iris & Pupil -->
  <ellipse cx="288" cy="236" rx="10" ry="11" fill="#2E0A05" />
  <circle cx="288" cy="236" r="6" fill="#000000" />
  <circle cx="285" cy="233" r="2.5" fill="#FFFFFF" />
  <!-- Kajal extension on outer corner -->
  <path d="M 320 235 Q 334 230 342 224" fill="none" stroke="#1A0202" stroke-width="3" stroke-linecap="round" />

  <!-- Third Eye (Trinetra) on Forehead -->
  <g>
    <path d="M 250 174 Q 256 183 250 192 Q 244 183 250 174 Z" fill="#D50000" stroke="#FFD700" stroke-width="1.5" />
    <circle cx="250" cy="183" r="2" fill="#FFFFFF" />
  </g>

  <!-- ======================================================== -->
  <!-- 4. NOSE RING (SACRED MAHA-NATH OF MAA)                   -->
  <!-- ======================================================== -->
  <!-- Gentle Nose outline -->
  <path d="M 248 238 Q 250 260 244 266 Q 250 270 256 266" fill="none" stroke="#8A180E" stroke-width="2.2" stroke-linecap="round" />

  <!-- Golden Ring (Nath) -->
  <circle cx="236" cy="270" r="18" fill="none" stroke="url(#goldCrown)" stroke-width="3.2" filter="url(#softShadow)" />
  <!-- Pearl / Ruby cluster on Nath -->
  <circle cx="221" cy="278" r="4.5" fill="#D50000" stroke="#FFD700" stroke-width="1" />
  <circle cx="220" cy="268" r="3.5" fill="#FFFFFF" />
  <circle cx="227" cy="285" r="3.5" fill="#FFFFFF" />
  <!-- Golden chain connecting Nath to ear/hair -->
  <path d="M 220 268 Q 170 265 140 235" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.85" />

  <!-- Soft Divine Smiling Lips -->
  <path d="M 235 285 Q 250 289 265 285 Q 250 298 235 285 Z" fill="url(#sindoorRed)" stroke="#B71C1C" stroke-width="1.5" />

  <!-- ======================================================== -->
  <!-- 5. SACRED GOLDEN TRISHUL IN CENTER FOREGROUND            -->
  <!-- ======================================================== -->
  <g filter="url(#softShadow)" opacity="0.95">
    <!-- Trishul Shaft -->
    <line x1="250" y1="298" x2="250" y2="445" stroke="url(#trishulGold)" stroke-width="6" stroke-linecap="round" />
    <!-- Damru on Trishul Shaft -->
    <path d="M 244 380 L 256 380 L 244 394 L 256 394 Z" fill="#FFE082" stroke="#B87300" stroke-width="1.5" />
    
    <!-- Central Spearhead of Trishul -->
    <path d="M 250 285 Q 254 320 258 335 L 242 335 Q 246 320 250 285 Z" fill="url(#trishulGold)" stroke="#FFF9C4" stroke-width="1" />

    <!-- Left Curved Blade of Trishul -->
    <path d="M 243 335 C 220 338, 212 305, 230 292 C 224 308, 235 325, 245 328 Z" fill="url(#trishulGold)" stroke="#FFF9C4" stroke-width="1" />

    <!-- Right Curved Blade of Trishul -->
    <path d="M 257 335 C 280 338, 288 305, 270 292 C 276 308, 265 325, 255 328 Z" fill="url(#trishulGold)" stroke="#FFF9C4" stroke-width="1" />
  </g>

  <!-- ======================================================== -->
  <!-- 6. SACRED GREETING BANNER AT BOTTOM                      -->
  <!-- ======================================================== -->
  <!-- Golden Banner Pill -->
  <g filter="url(#softShadow)">
    <rect x="75" y="425" width="350" height="52" rx="26" fill="url(#goldCrown)" stroke="#FFFDE7" stroke-width="2.5" />
    <rect x="80" y="429" width="340" height="44" rx="22" fill="#5E000D" />
    
    <text x="250" y="456" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="20" fill="#FFE885" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">
      🚩 शुभ नवरात्रि महोत्सव 🚩
    </text>
  </g>
</svg>
